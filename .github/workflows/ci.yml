name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false

      - name: Check
        run: cargo check

      - name: Install nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci

      - name: Test (all features)
        run: cargo nextest run --all-features --profile ci

      - name: Doctests
        run: cargo test --doc --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  coverage:
    # Diff coverage gate: fail when coverage of the lines this PR adds or
    # changes drops below the threshold, so new uncovered code (pub fn /
    # branches) cannot merge untested. No overall-percent floor (which would
    # flag existing unreachable code); no base-vs-PR double measurement.
    # Rationale: ported from yomu (Issue #223), THRESHOLDS.md "Coverage".
    # Runs on macos like the test job: the rurico dependency pulls mlx-sys
    # (MLX FFI), which needs BLAS + Apple silicon and cannot build on Linux.
    # --all-features mirrors the test job so coverage matches what is tested.
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov

      # diff coverage gate から「unit test 対象外の層」を lcov から除外する。
      # プロジェクトの testable-layering (STRUCTURE.md: I/O wiring は integration、
      # Logic のみ unit) に gate を合わせ、機械的変更の誤発火を防ぐ:
      #   - **/tests.rs         : #[cfg(test)] 内の防御アーム (test 成功時に未実行) (#127)
      #   - model/download.rs   : I/O 合成ルート (実 network DL + on-device probe)。
      #                           wiring する logic は try_download_and_verify_with_fns で被覆
      #   - bin/eval_harness.rs : eval/benchmark tooling (実モデルロード)。logic は test suite で被覆
      - name: Generate lcov coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --ignore-filename-regex '(/tests\.rs$|/model/download\.rs$|/bin/eval_harness\.rs$)'

      - name: Diff coverage gate (changed lines >= 95%)
        id: diff_coverage
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # diff-cover is a Python tool; isolate it in a venv to avoid PEP 668
          # (externally-managed environments) regardless of the runner's Python.
          python3 -m venv /tmp/diff-cover-venv
          /tmp/diff-cover-venv/bin/pip install --quiet diff-cover
          # diff-cover writes the HTML report before applying --fail-under, so the
          # report exists for the upload step below even when this gate fails.
          # (--html-report is deprecated in diff-cover 10.x; use --format html:.)
          /tmp/diff-cover-venv/bin/diff-cover lcov.info \
            --compare-branch=origin/main \
            --format html:diff-cover-report.html \
            --fail-under=95

      - name: Upload diff coverage report
        # On gate failure the report pinpoints which changed lines are uncovered,
        # so a reviewer need not open the raw job log (#134). Scoped to the gate
        # step's own failure so an upstream failure (e.g. lcov generation) does not
        # trigger an empty upload; if-no-files-found:error then asserts the report
        # really was written.
        if: ${{ failure() && steps.diff_coverage.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-coverage-report
          path: diff-cover-report.html
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          cache-targets: false

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
